# Inactive. Pin the reviewed source before activating only on the owned QA branch.
name: Temporary PostgreSQL provider acceptance
on:
  create:
permissions:
  contents: read
jobs:
  postgres:
    if: github.repository == 'alvarovillalbaa/intelligent-visualization' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/postgres-provider-20261106-1' && github.ref == 'refs/heads/qa/postgres-provider-20261106-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: iv_ci
          POSTGRES_PASSWORD: authored-ci-only
          POSTGRES_DB: intelligent_visualization_ci
        ports:
          - 54431:5432
        options: >-
          --health-cmd "pg_isready -U iv_ci -d intelligent_visualization_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOURCE_COMMIT: 38e152f406aad9cebfbd6a5788a1e5b7d43fff56
      IV_POSTGRES_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
      LOCAL_DATABASE_URL: postgresql://iv_ci:authored-ci-only@127.0.0.1:54431/intelligent_visualization_ci
      IV_POSTGRES_TEST_ADMIN_URL: postgresql://iv_ci:authored-ci-only@127.0.0.1:54431/postgres
      IV_POSTGRES_FIXTURES: disposable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify bounded local PostgreSQL and app acceptance
        run: python3 scripts/postgres-acceptance-controller.py
