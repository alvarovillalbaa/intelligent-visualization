# Inactive until reviewed source is pinned and the exact QA branch is created.
name: Temporary Supabase provider diagnostics 3
on:
  create:
permissions:
  contents: read
jobs:
  supabase-diagnostics:
    if: github.repository == 'alvarovillalbaa/intelligent-visualization' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/supabase-provider-20261107-3' && github.ref == 'refs/heads/qa/supabase-provider-20261107-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: b2b404de76c6933fddb20823da53f93896d4f492
      IV_SUPABASE_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 1
          clean: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: ''
      - name: Collect isolated Supabase policy metadata only (zero tests)
        run: python3 scripts/supabase-provider-checks.py
