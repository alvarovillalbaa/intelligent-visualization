# Inactive template. Bind to the exact reviewed source before creating the QA ref.
name: Temporary Supabase current Chromium checks
on:
  create:
permissions:
  contents: read
jobs:
  supabase-application:
    if: github.repository == 'alvarovillalbaa/intelligent-visualization' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/supabase-application-current-chromium-20261110-1' && github.ref == 'refs/heads/qa/supabase-application-current-chromium-20261110-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 5abc47e8745c2d7fb2b35d3b74ed0f7aa6cc4c13
      IV_SUPABASE_APPLICATION_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 1
          clean: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: ''
      - name: Check actual selected factories with the isolated current Chromium
        shell: bash
        run: python3 scripts/supabase-application-checks.py | tee "$RUNNER_TEMP/iv-current-chromium-result.log"
      - name: Retain the sanitized controller report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iv-current-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iv-current-chromium-result.log
          if-no-files-found: error
          retention-days: 1
